{% extends 'base.html' %}
{% block title %}Join{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form class="card auth-card" method="post" novalidate>
    {% csrf_token %}
    <h1>Join HELPUP</h1>
    <p class="meta">Connect beyond your circle. It takes less than a minute.</p>
    {% include 'partials/form_fields.html' %}
    <button class="btn btn-accent btn-block" type="submit">Create account</button>
    <p class="meta center">Already a member? <a href="{% url 'accounts:login' %}"><strong>Log in</strong></a></p>
  </form>
</div>
{% endblock %}
